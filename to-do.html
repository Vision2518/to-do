<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input id="task" placeholder="enter a new task" />
    <ul id="taskList"></ul>
    <button id="add-task">Add Task</button>
    <script>
      let editingTask=null;
      const taskInput = document.getElementById("task");
      const taskList = document.getElementById("taskList");
      const addTaskButton = document.getElementById("add-task");
      const addTask = () => {
        if (taskInput.value.trim() === "") return;
        const item = document.createElement("li");
        const delButton = document.createElement("button");
        const editButton=document.createElement('button');
        delButton.textContent = "Delete";
        item.textContent = taskInput.value;
        taskInput.value = "";
        taskList.appendChild(item);
        editButton.textContent = "Edit";
        editButton.addEventListener('click',()=>editTask(item));
        delButton.addEventListener("click",()=>{deleteButton(item)});
        item.appendChild(editButton);
        item.appendChild(delButton);
      };
      const deleteButton = (item) => {
        item.remove();
      };
      const editTask = (item) => {
        editingTask = item;
        taskInput.value = editingTask.textContent;
        addTaskButton.textContent = "Update Task";
      };
      addTaskButton.addEventListener("click", addTask);
    </script>
  </body>
</html>
